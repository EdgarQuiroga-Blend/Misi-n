services:
  opensearch-node:
    image: opensearchproject/opensearch:2.13.0
    container_name: hpg-opensearch
    environment:
      - cluster.name=hpg-cluster
      - node.name=hpg-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - network.host=0.0.0.0     
      - http.cors.enabled=true
      - http.cors.allow-origin=*
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - http.cors.allow-methods=OPTIONS,HEAD,GET,POST,PUT,DELETE
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - hpg-opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - hpg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: hpg-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://hpg-opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US.UTF-8
      - TZ=UTC
      - NODE_OPTIONS="--max-old-space-size=2048"
    ports:
      - "5601:5601"
    networks:
      - hpg-network
    depends_on:
      opensearch-node:
        condition: service_healthy
    restart: always
    links:
      - opensearch-node:hpg-opensearch
volumes:
  hpg-opensearch-data:
    name: hpg-opensearch-data

networks:
  hpg-network:
    name: hpg-network
    driver: bridge
